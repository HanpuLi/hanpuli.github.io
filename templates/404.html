<!DOCTYPE html>
<html lang="{{HTML_LANG}}" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>{{notfound.meta_title}}</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f2eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
{{ICON_LINKS}}
{{FONT_PRELOADS}}
<script src="{{ASSET_PREFIX}}assets/accessibility.js"></script>
<link rel="stylesheet" href="{{ASSET_PREFIX}}assets/site.css">
</head>
<body class="notfound-page locale-{{LOCALE}}">
  <a class="skip-link" href="#main">{{common.skip_content}}</a>
  {{READING_TOOLS}}
  <header class="page-topbar">
    <a class="page-wordmark" href="{{HOME_HREF}}">{{PRIMARY_NAME}} <span lang="zh-Hant-HK">{{CHINESE_NAME}}</span></a>
    <nav class="page-nav" aria-label="{{common.site_nav_label_attr}}">
      {{PORTFOLIO_NAV}}
    </nav>
    <nav class="page-languages" aria-label="{{common.language_nav_label_attr}}">
      {{LANG_SWITCHER}}
    </nav>
  </header>
  <main class="notfound-shell" id="main" tabindex="-1">
    <p class="notfound-code" aria-hidden="true">404</p>
    <div class="notfound-copy">
      <p class="notfound-source"><a href="{{CI_HREF}}#b2">{{notfound.source}}</a></p>
      <h1>{{notfound.line}}</h1>
      <p class="notfound-description">{{notfound.description}}</p>
      <a class="notfound-home" href="{{HOME_HREF}}">{{notfound.home}}</a>
    </div>
  </main>
{{NOTFOUND_RUNTIME}}
</body>
</html>
