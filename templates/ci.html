<!DOCTYPE html>
<html lang="{{HTML_LANG}}" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>{{ci.meta_title}}</title>
<meta name="description" content="{{ci.meta_description_attr}}">
<link rel="canonical" href="{{CANONICAL_URL}}">
{{HREFLANG_LINKS}}
<meta property="og:type" content="article">
<meta property="og:title" content="{{ci.meta_title_attr}}">
<meta property="og:description" content="{{ci.meta_description_attr}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#f5f2eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>{{CI_GLYPH}}</text></svg>">
{{FONT_PRELOADS}}
<script src="{{ASSET_PREFIX}}assets/accessibility.js"></script>
<link rel="stylesheet" href="{{ASSET_PREFIX}}assets/site.css">
</head>
<body class="literary-page locale-{{LOCALE}}">
<a class="skip-link" href="#poems">{{common.skip_poems}}</a>
{{READING_TOOLS}}
<div class="wrap">

  <div class="page-topbar">
    <a class="page-wordmark" href="{{HOME_HREF}}">{{PRIMARY_NAME}} <span lang="zh-Hant-HK">{{CHINESE_NAME}}</span></a>
    <nav class="page-nav" aria-label="{{common.site_nav_label_attr}}">
      {{PORTFOLIO_NAV}}
    </nav>
    <nav class="page-languages" aria-label="{{common.language_nav_label_attr}}">
      {{LANG_SWITCHER}}
    </nav>
  </div>

  <header>
    <h1>{{ci.heading}}</h1>
    <div class="sub">
      <p>{{ci.subtitle}}</p>
      <p class="source-title" lang="{{SOURCE_LANG}}">{{CI_SOURCE_HEADING}}</p>
    </div>
    <p class="toc">{{CI_TOC}}</p>
  </header>

  <main id="poems" tabindex="-1">
    {{CI_POEMS}}
  </main>

  <footer>
    <p><a href="{{HOME_HREF}}">← {{PRIMARY_NAME}}</a> · {{ci.footer}}</p>
  </footer>

</div>
</body>
</html>
