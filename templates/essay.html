<!DOCTYPE html>
<html lang="{{HTML_LANG}}" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>From Gears to Gasp · Hanpu Li</title>
<meta name="description" content="{{ESSAY_META_DESCRIPTION_ATTR}}">
<link rel="canonical" href="{{ESSAY_CANONICAL}}">
{{ESSAY_HREFLANG_LINKS}}
{{SOCIAL_META}}
<meta name="theme-color" content="#f5f2eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
{{ICON_LINKS}}
<script src="{{ESSAY_ASSET_PREFIX}}assets/accessibility.js"></script>
<link rel="stylesheet" href="{{ESSAY_ASSET_PREFIX}}assets/site.css">
{{STRUCTURED_DATA}}
</head>
<body class="essay-page locale-{{LOCALE}}">
<a class="skip-link" href="#essay-main">{{common.skip_content}}</a>
{{READING_TOOLS}}
<div class="wrap">
  <header class="page-topbar">
    <a class="page-wordmark" href="{{HOME_HREF}}">{{PRIMARY_NAME}} <span lang="zh-Hant-HK">{{CHINESE_NAME}}</span></a>
    <nav class="page-nav" aria-label="{{common.site_nav_label_attr}}">
      {{PORTFOLIO_NAV}}
    </nav>
    <nav class="page-languages" aria-label="{{common.language_nav_label_attr}}">
      {{ESSAY_LANG_SWITCHER}}
    </nav>
  </header>

  <main id="essay-main" tabindex="-1">
    {{ESSAY_LANGUAGE_NOTE}}
    <div lang="en-GB">
      {{ESSAY_BODY}}
    </div>
  </main>

  <footer class="page-footer essay-footer">
    <p><a href="{{HOME_HREF}}">{{PRIMARY_NAME}}</a></p>
    <p class="page-footer-context"><a href="{{WRITING_HREF}}">{{common.nav.writing}}</a> <span aria-hidden="true">·</span> <a href="{{ABOUT_HREF}}">{{ABOUT_LINK_LABEL}}</a></p>
  </footer>
</div>
</body>
</html>
