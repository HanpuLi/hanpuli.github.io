<div class="kanbun-heading" data-kanbun-heading><p class="kanbun-title">無題·踏莎行</p></div><div class="kanbun-body"><div class="kanbun-stanza" data-kanbun-stanza><p>一室{ノ}香{ハ}温{カク}，兩痕{ノ}影{ハ}並{ブ}。</p><p>笑聲{ハ}沉{ミ}[二]‐入{ル}簾間{ノ}暝{ニ}[一]。</p><p>隔{テテ}[レ]簾{ヲ}燈色欲{シ}[二]先{ヅ}寒{カラント}[一]，有{リテ}[レ]人暗處{ニ}衣{ノ}光冷{タシ}。</p></div><div class="kanbun-stanza" data-kanbun-stanza><p>欲{シテ}[レ]喚{バント}還{タ}休{ミ}，歡{ハ}猶{ホ}未(いま){ダ}‹ず›[レ]省(さと){ラ}。</p><p>分明{ニ}一水{アリテ}無{シ}[二]舟艇[一]。</p><p>殘灰散{ジ}盡{クシテ}各{オノ}歸{ル}時，餘釭獨{リ}照{ラシテ}[二]空庭{ヲ}[一]靜{カナリ}。</p></div></div>
</main>

<noscript><p>一室香温，兩痕影並。
笑聲沉入簾間暝。
隔簾燈色欲先寒，有人暗處衣光冷。

欲喚還休，歡猶未省。
分明一水無舟艇。
殘灰散盡各歸時，餘釭獨照空庭靜。</p></noscript>
