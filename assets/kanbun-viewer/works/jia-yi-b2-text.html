<noscript><p>一室香温，兩痕影並。
笑聲沉入簾間暝。
隔簾燈色欲先寒，有人暗處衣光冷。

欲喚還休，歡猶未省。
分明一水無舟艇。
殘灰散盡各歸時，餘釭獨照空庭靜。</p></noscript>
