<div class="kanbun-stanza" data-kanbun-stanza><p>幾度{カ}深宵{ニ}同{ジク}默坐{シ}，孤燈{ノ}紅淚垂{ルルコト}遲{シ}。</p><p>一秋{ノ}心緒有[二]誰{カ}知{ルコト}[一]。</p><p>啓{ケバ}[レ]窗{ヲ}星欲[レ]墜{チント}，光落[二]兩人{ノ}衣{ニ}[一]。</p></div><div class="kanbun-stanza" data-kanbun-stanza><p>不{ズ}[レ]語{ラ}各{オノ}含[二]無限{ノ}思{ヲ}[一]，而今惟{ダ}道[二]相期{スト}[一]。</p><p>夜闌{ケテ}暗{ニ}忘[二]漏聲{ノ}移{ルヲ}[一]。</p><p>慵(ものう){ク}來還{タ}指[レ]日{ヲ}，明日又{タ}今時。</p></div>

<noscript><p>幾度深宵同默坐，孤燈紅淚垂遲。
一秋心緒有誰知。
啓窗星欲墜，光落兩人衣。

不語各含無限思，而今惟道相期。
夜闌暗忘漏聲移。
