<div class="kanbun-stanza" data-kanbun-stanza><p>燈下{ニ}讀[二]舊詞{ヲ}[一]，夜深{ク}方(はじ){メテ}得[レ]眠{ル}。</p><p>當時{ハ}渾{テ}不{ズ}[レ]異{ナラ}，往事{ハ}付[二]流年{ニ}[一]。</p><p>我{ハ}又{タ}移[二]新處{ニ}[一]，君{ハ}猶{ホ}理[二]舊篇{ヲ}[一]。</p><p>小兒{ハ}催[二]入[レ]夢{ニ}[一]，蕙草{ハ}立[二]窗前{ニ}[一]。</p><p>莫{カレ}[レ]攀[二]檐前{ノ}柳{ヲ}[一]，莫{カレ}[レ]數(かぞ){ウル}[二]落花天{ヲ}[一]。</p><p>忘川{ヲ}人{ハ}自{ラ}渡{リ}，各自{ニ}有[二]歸{ル}邊[一]。</p></div>

<noscript><p>燈下讀舊詞，夜深方得眠。
當時渾不異，往事付流年。
我又移新處，君猶理舊篇。
小兒催入夢，蕙草立窗前。
莫攀檐前柳，莫數落花天。
忘川人自渡，各自有歸邊。</p></noscript>
