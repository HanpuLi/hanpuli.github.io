<div class="kanbun-heading" data-kanbun-heading><p class="kanbun-title">應天長·喚(よ){ビ}回(かへ){ス}</p></div><div class="kanbun-body"><div class="kanbun-stanza" data-kanbun-stanza><p>喚{ビ}回(かえ){シテ}猶{ホ}把{リテ}[二]空衣{ヲ}[一]理{ム}，</p><p>袖口{ノ}餘溫{ハ}留{マル}[二]在指{ニ}[一]。</p><p>掩{ヒ}[レ]門{ヲ}初{ムレバ}，聲又{タ}起{コル}，</p><p>聽{キ}[二]‐盡{クシテ}無聲{ヲ}[一]偏{ニ}側(そばだ){ツ}[レ]耳{ヲ}。</p></div><div class="kanbun-stanza" data-kanbun-stanza><p>指微{カニ}蜷(かが){マリ}，杯{ハ}倒(さか){シマニ}置{カレ}，</p><p>匙底{ニ}尚{ホ}留{ム}[二]殘齒{ヲ}[一]。</p><p>不{ズ}[レ]許{サ}[二]指{ノ}溫(ぬく){モリノ}先{ヅ}退{クヲ}[一]，</p><p>土木火金水。</p></div></div>
</main>

<noscript><p>喚回猶把空衣理，
袖口餘溫留在指。
掩門初，聲又起，
聽盡無聲偏側耳。

指微蜷，杯倒置，
匙底尚留殘齒。
不許指溫先退，
土木火金水。</p></noscript>
