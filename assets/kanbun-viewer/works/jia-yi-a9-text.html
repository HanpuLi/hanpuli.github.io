<div class="kanbun-stanza" data-kanbun-stanza><p>兩疊{ノ}殘箋{ヲ}展[二]案前{ニ}[一]，舊時{ノ}燈影{ハ}各{オノ}成[レ]篇{ヲ}。</p><p>親{ラ}將[二]一線{ヲ}[一]縫[二]卿我{ヲ}[一]，留{メ}得(え){テ}鴛鴦{ヲ}傍[レ]脊{ニ}眠{ラシム}。</p></div><div class="kanbun-stanza" data-kanbun-stanza><p>賓一{タビ}哂{ヒ}，語{ハ}猶{ホ}慳(やぶさ){シ}。</p><p>箋中{ノ}淺字{ハ}只{ダ}加(くわ){ヘヨト}[レ]餐{ヲ}。</p><p>深言{ハ}怕[レ]誤{リヲ}重重{ニ}掩{ヒ}，欲[レ]喚{バント}還{タ}休{ミ}欲[レ]喚{バントスルモ}難{シ}。</p></div>

<noscript><p>兩疊殘箋展案前，舊時燈影各成篇。
親將一線縫卿我，留得鴛鴦傍脊眠。

賓一哂，語猶慳。
箋中淺字只加餐。
深言怕誤重重掩，欲喚還休欲喚難。</p></noscript>
