<div class="kanbun-heading" data-kanbun-heading><p class="kanbun-title">無題·臨江仙</p></div><div class="kanbun-body"><div class="kanbun-stanza" data-kanbun-stanza><p>燭暗{ク}蛩寒{ク}簾影瘦{セ}，殘酲{ハ}猶{ホ}帶{ブ}[二]微温{ヲ}[一]。</p><p>筆停{マリ}紙澀{リ}墨先{ヅ}吞{ム}。</p><p>未(いま){ダ}‹ず›«シテ»[レ]緘{セ}還{タ}自{ラ}疊{ミ}，一折{ハ}一重{ノ}門。</p></div><div class="kanbun-stanza" data-kanbun-stanza><p>不(あら){ズ}[二]是{レ}東風{ノ}先{ヅ}折{リ}取{ルニ}[一]，恐{ル}[二]花{ノ}為{ニ}[レ]我{ガ}辭{スルヲ}[一レ]根{ヲ}。</p><p>新痕舊鑰莫{カレ}[二]輕(かるがる){シク}論{ズルコト}[一]。</p><p>相逢{フモ}原{ヨリ}是{レ}客，客{ハ}受{ク}[二]主家{ノ}恩{ヲ}[一]。</p></div></div>
</main>

<noscript><p>燭暗蛩寒簾影瘦，殘酲猶帶微温。
筆停紙澀墨先吞。
未緘還自疊，一折一重門。

不是東風先折取，恐花為我辭根。
新痕舊鑰莫輕論。
相逢原是客，客受主家恩。</p></noscript>
