<div class="kanbun-heading" data-kanbun-heading><p class="kanbun-title">無題·臨江仙</p></div><div class="kanbun-body"><div class="kanbun-stanza" data-kanbun-stanza><p>虛廊{ノ}月好{ク}人初{メテ}定{マリ}，同{ジク}攜{ヘテ}花徑{ニ}遲遲{タリ}。</p><p>燈前{ノ}笑語兩{ツナガラ}無{シ}[レ]疑{ヒ}。</p><p>舊衾{ハ}隨{ヒテ}[レ]手{ニ}與{フ}，今日不{ズ}[レ]須(もち){ヰ}[レ]知{ルヲ}。</p></div><div class="kanbun-stanza" data-kanbun-stanza><p>客散{ズルハ}非{ズ}[レ]因{ルニ}[二]誰{カ}獨{リ}在{ルニ}[一]，他人{ハ}皆自{ラ}相依{ル}。</p><p>席{ノ}旁{ラニ}偶{タマ}坐{シテ}共{ニ}相棲{ム}。</p><p>漏殘{リテ}晨露上{リ}，風過{ギテ}落花{ノ}時。</p></div></div>

<noscript><p>虛廊月好人初定，同攜花徑遲遲。
燈前笑語兩無疑。
舊衾隨手與，今日不須知。

客散非因誰獨在，他人皆自相依。
席旁偶坐共相棲。
漏殘晨露上，風過落花時。</p></noscript>
