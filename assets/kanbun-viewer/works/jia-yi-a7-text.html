<div class="kanbun-stanza" data-kanbun-stanza><p>手{ヅカラ}分[二]舊蕙{ヲ}[一]移[二]新種{ヲ}[一]，如今可(え){ルカ}[レ]記[二]春温{ヲ}[一]。</p><p>當初玉指{ハ}贈[二]蘭蓀{ヲ}[一]。</p><p>不{ズ}[レ]知[二]根已{ニ}定{マルヲ}[一]，空{シク}自{ラ}換[二]苔痕{ヲ}[一]。</p></div><div class="kanbun-stanza" data-kanbun-stanza><p>別後西窗{ハ}青{キコト}幾度{カ}，也{タ}應(まさ){ニ}‹べ›«シ»灌溉[二]朝昏{ニ}[一]。</p><p>爾來各自{ニ}長[二]年輪{ヲ}[一]。</p><p>偶然{ニ}風過{グル}處，依約{トシテ}暗香{ヲ}聞{ク}。</p></div>
</main>

<noscript><p>手分舊蕙移新種，如今可記春温。
當初玉指贈蘭蓀。
不知根已定，空自換苔痕。

別後西窗青幾度，也應灌溉朝昏。
爾來各自長年輪。
偶然風過處，依約暗香聞。</p></noscript>
