<div class="kanbun-stanza" data-kanbun-stanza><p>小鑰{ハ}經[レ]年{ヲ}鏽暗生{ジ}，故箋{ヲ}翻{シ}罷{リテ}眼猶{ホ}明{ラカナリ}。</p><p>當時避{ケ}卻{シテ}鴛鴦字{ヲ}，卻{ツテ}把鴛鴦{ヲ}寫[二]幾層{ニ}[一]。</p></div><div class="kanbun-stanza" data-kanbun-stanza><p>窗月冷{タク}，鬢霜{ニ}驚{ク}。</p><p>如今畫裏{ニ}喚[二]誰{ノ}名{ヲ}[一]。</p><p>相看{レバ}似[三]隔[二]前生{ノ}事{ヲ}[一]，齧(か){ミ}盡{クスモ}痴根{ヲ}草又{タ}青{シ}。</p></div>
</main>

<noscript><p>小鑰經年鏽暗生，故箋翻罷眼猶明。
當時避卻鴛鴦字，卻把鴛鴦寫幾層。

窗月冷，鬢霜驚。
如今畫裏喚誰名。
相看似隔前生事，齧盡痴根草又青。</p></noscript>
