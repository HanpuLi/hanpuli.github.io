<div class="kanbun-heading" data-kanbun-heading><p class="kanbun-title">浣溪沙</p><p class="kanbun-title kanbun-preface">後(のち)三日，復{タ}宿{リ}[二]他舍{ニ}[一]，臥(ふ){シテ}不{ズ}[レ]安{ンゼ}[レ]席{ニ}</p></div><div class="kanbun-body"><div class="kanbun-stanza" data-kanbun-stanza><p>久{シク}餓{ヱタル}鵷(えん)鶵(すう)練實空{シ}。他家{ニ}聊{カ}借{ル}[二]一枝{ノ}桐{ヲ}[一]。</p><p>醴泉{ハ}何(いづ){レノ}處{ニカ}可(べ){キ}[レ]澆(そそ){グ}[レ]胸{ニ}。</p></div><div class="kanbun-stanza" data-kanbun-stanza><p>君{ハ}奏{シテ}[二]咸韶{ヲ}[一]娛(たの){シマシメ}[二]海鳥{ヲ}[一]，儂(われ){ハ}羅(つら){ネテ}[二]鼎俎{ヲ}[一]饗{ス}[二]飛鴻{ヲ}[一]。</p><p>臠杯未(いま){ダ}‹ざ›«ルニ»[レ]舉{ゲ}目先{ヅ}濛(かす){ム}。</p></div></div>
</main>

<noscript><p>久餓鵷鶵練實空。他家聊借一枝桐。
醴泉何處可澆胸。

君奏咸韶娛海鳥，儂羅鼎俎饗飛鴻。
臠杯未舉目先濛。</p></noscript>
