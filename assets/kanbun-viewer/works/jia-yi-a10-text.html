<div class="kanbun-stanza" data-kanbun-stanza><p class="kanbun-title">中呂</p><p class="kanbun-title kanbun-preface">山坡羊</p><p class="kanbun-title kanbun-preface">又(ま){タ}過{グ}[二]舊廬{ヲ}[一]</p><p>風{ハ}迎{ヘ}[レ]面{ヲ}，人{ハ}立{ツ}[レ]此(ここ){ニ}，</p><p>鼻尖一{タビ}動{ケバ}魂先{ヅ}至{ル}。</p><p>認{ムルコト}不{ズ}[レ]真{ナラ}，卻{ツテ}認(にん)真(しん){ナリ}，</p><p>繞{リ}來{タリ}繞{リ}去{リテ}街角{ニ}立{ツ}。</p><p>廿(にじふ)年{ノ}風霜{ハ}渾{テ}不{ズ}[レ]記(き){セ}，</p><p>這(こ){ノ}點(てん)子(し){ノ}氣味偏{ニ}惦(てん)記(き){ス}。</p></div><div class="kanbun-stanza" data-kanbun-stanza><p>遲{キハ}，是{レ}誤{レリ}了；</p><p>歸{ルモ}，也(ま){タ}是{レ}誤{レリ}了。</p></div>
</main>

<noscript><p>風迎面，人立此，
鼻尖一動魂先至。
認不真，卻認真，
繞來繞去街角立。
廿年風霜渾不記，
這點子氣味偏惦記。

遲，是誤了；
歸，也是誤了。</p></noscript>
