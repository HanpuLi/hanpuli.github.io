<noscript><p>簾影幾宵長共話，露痕初濕闌干。
言猶未了息先安。
夢深渾不覺，月上夜將殘。

他日重簾垂到地，垂來一似從前。
手臨燈畔數迴旋。
明朝風或緊，窗且掩周全。</p></noscript>
