<div class="kanbun-stanza" data-kanbun-stanza><p>鑰(かぎ)齒新{タニ}裁{シテ}心自{ラ}珍{シミ}，提{ゲ}[レ]毫{ヲ}未(いま){ダ}‹ざ›«ルニ»[レ]寫{サ}已{ニ}逡巡{ス}。</p><p>拆(ひら){キ}來{タレバ}只{ダ}有{リ}[二]三行{ノ}字[一]，半晌{ハ}綢繆{シ}一晌{ハ}嗔(いか){ル}。</p></div><div class="kanbun-stanza" data-kanbun-stanza><p>星欲{シ}[レ]墜{チント}，露初{メテ}勻(ひと){シ}。</p><p>當時未(いま){ダ}‹ず›[三]敢{ヘテ}喚{バ}[二]真真{ヲ}[一]。</p><p>案前{ノ}字暖{カク}春{ノ}封淺{ク}，猶{ホ}有{リテ}[二]殘香[一]繞{リ}[レ]指{ヲ}温{カシ}。</p></div>
</main>

<noscript><p>鑰齒新裁心自珍，提毫未寫已逡巡。
拆來只有三行字，半晌綢繆一晌嗔。

星欲墜，露初勻。
當時未敢喚真真。
案前字暖春封淺，猶有殘香繞指温。</p></noscript>
